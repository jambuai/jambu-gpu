[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jambu-gpu"
version = "0.1.0"
description = "Provider-agnostic CLI for provisioning and managing temporary GPU runtimes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jambu.ai" }]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "PyYAML>=6.0.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "respx>=0.21.0"]

[project.scripts]
jambu-gpu = "jambu_gpu.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["jambu_gpu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
